spring.application.name=Ticketra
server.port=8082

# Database Connection
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/postgres}
spring.datasource.username=postgres
spring.datasource.password=changemeinprod!

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.security.oauth2.resourceserver.jwt.issuer-uri=${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI:http://localhost:9090/realms/event-ticket-platform}

# Razorpay Credentials
razorpay.key.id=${RAZORPAY_KEY_ID:}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:}
razorpay.webhook.secret=${RAZORPAY_WEBHOOK_SECRET:}

# Keycloak Admin API (self-signup, staff invites)
keycloak.auth-server-url=${KEYCLOAK_AUTH_SERVER_URL:http://localhost:9090}
keycloak.realm=${KEYCLOAK_REALM:event-ticket-platform}
keycloak.admin-client-id=${KEYCLOAK_ADMIN_CLIENT_ID:ticket-backend-service}
keycloak.admin-client-secret=${KEYCLOAK_ADMIN_CLIENT_SECRET:backend-client-secret-123}

# Mail (Mailtrap for dev — swap to a real provider before a live event)
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
mail.from=${MAIL_FROM:no-reply@ticketra.app}
app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}